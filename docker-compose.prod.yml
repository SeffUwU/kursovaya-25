version: '3.8'

services:
  service_db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: service_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5555:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - default
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - '3018:3000'
    depends_on:
      - service_db
    env_file:
      - .env
    networks:
      - default

volumes:
  pgdata:
networks:
  default:
    name: nginx
